{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shoe Boutique</title>
    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Custom CSS -->
    <link href="{% static 'store/style.css' %}" rel="stylesheet">
</head>

<body>

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg fixed-top">
        <div class="container">
            <a class="navbar-brand" href="{% url 'product_list' %}">
                <i class="fa-solid fa-shoe-prints me-2"></i>LATLI
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <form class="d-flex ms-auto" method="GET" action="{% url 'product_list' %}">
                    <div class="input-group">
                        <span class="input-group-text bg-white border-end-0"><i
                                class="fa fa-search text-muted"></i></span>
                        <input class="form-control border-start-0 ps-0" type="search" name="q"
                            placeholder="Find your style..." value="{{ search_query|default:'' }}">
                    </div>
                </form>
            </div>
        </div>
    </nav>

    <!-- Spacer for fixed navbar -->
    <div style="height: 80px;"></div>

    <!-- Main Content -->
    <div class="container py-5 min-vh-100">
        {% block content %}{% endblock %}
    </div>

    <!-- Footer -->
    <footer class="bg-white py-5 border-top mt-5">
        <div class="container text-center">
            <h4 class="mb-3" style="font-family: 'Poppins', sans-serif;">LATLI SHOES</h4>
            <div class="mb-4">
                <a href="#" class="text-dark mx-2"><i class="fab fa-instagram fa-lg"></i></a>
                <a href="#" class="text-dark mx-2"><i class="fab fa-facebook fa-lg"></i></a>
                <a href="#" class="text-dark mx-2"><i class="fab fa-whatsapp fa-lg"></i></a>
            </div>
            <p class="text-muted small">© 2026 Latli Shoe Store. All rights reserved.</p>
        </div>
    </footer>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
